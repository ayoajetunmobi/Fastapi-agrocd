name: Build, Push, and Update Config

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FastAPI Application
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Generate Short Git Commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USER }}/mycicdrepo:${{ steps.vars.outputs.sha_short }}
            
  update-target-repo:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Target Configuration Repo
        uses: actions/checkout@v4
        with:
          repository: 'ayoajetunmobi/agrocd'
          token: ${{ secrets.REPO_TOKEN }}
          persist-credentials: true
      - name: Extract FastAPI Git Commit SHA
        id: vars
        run: |
          # Fetch the short SHA generated by the previous job
          # echo "sha_short=${{ needs.build-and-push.outputs.sha_short }}" 
          # Or recalculate it if you pass it through job outputs. For simplicity, we can fetch it via github context:
          echo "sha_short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
      - name: Update Image Name in File
        run: |
          # Target file path (e.g., deployment.yaml, docker-compose.yml, or a config file)
          TARGET_FILE="manifest/fastapiApp.yaml"
          
          # Replace old image references with the new tagged image version
          # Adjust the regex pattern below to match your file structure exactly
          sed -i "s|image: .*|image: ${{ secrets.DOCKERHUB_USERNAME }}/mycicdrepo:${{ steps.vars.outputs.sha_short }}|g" $TARGET_FILE

      - name: Commit and Push Changes to Target Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add deployment.yaml
          
          # Check if there are changes before attempting to commit
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: update fastapi image to tag ${{ steps.vars.outputs.sha_short }} [skip ci]"
            git push origin main
          else
            echo "No changes detected in configuration file."
          fi
          push: true
            tags: |
              ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-app:${{ steps.vars.outputs.sha_short }}
